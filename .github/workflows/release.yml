name: Build, Test, and Release AppImage (v0.7.0)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Package GridLock v0.7.0 AppImage
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie

    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
      QT_QPA_PLATFORM: "offscreen"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

    steps:
      - name: Install v0.7.0 system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            clang \
            clangd \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            git \
            ca-certificates \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            libqt6sql6-sqlite \
            libqt6svg6-dev \
            libsqlite3-dev \
            openmpi-bin \
            libopenmpi-dev \
            gdb \
            lldb \
            llvm \
            binutils \
            elfutils \
            file \
            xvfb \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxcb-shape0 \
            desktop-file-utils \
            patchelf \
            wget \
            curl \
            imagemagick \
            appstream
          apt-get install -y libfuse2t64 || apt-get install -y libfuse2 || true
          update-ca-certificates
          ldconfig

      - name: Install or Build qtermwidget6 (Debian trixie / Ubuntu fallback)
        run: |
          apt-get install -y libqtermwidget6-dev || true
          if ! pkg-config --exists qtermwidget6; then
            git clone --depth 1 --branch 2.0.0 https://github.com/lxqt/lxqt-build-tools.git /tmp/lxqt-build-tools
            cmake -S /tmp/lxqt-build-tools -B /tmp/lxqt-build-tools/build -GNinja -DCMAKE_INSTALL_PREFIX=/usr
            ninja -C /tmp/lxqt-build-tools/build install
            git clone --depth 1 --branch 2.0.1 https://github.com/lxqt/qtermwidget.git /tmp/qtermwidget
            cmake -S /tmp/qtermwidget -B /tmp/qtermwidget/build -GNinja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib
            ninja -C /tmp/qtermwidget/build install
            ldconfig
          fi

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compile Qt-Advanced-Stylesheets
        run: |
          git submodule update --init --recursive || true
          cmake -S external/Qt-Advanced-Stylesheets -B external/Qt-Advanced-Stylesheets/build -GNinja \
            -DQT_VERSION_MAJOR=6 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          ninja -C external/Qt-Advanced-Stylesheets/build
          ninja -C external/Qt-Advanced-Stylesheets/build install
          ldconfig

      - name: Configure and Run Full 26-Suite Test Harness (Headless)
        run: |
          meson setup builddir --prefix=/usr --buildtype=release -Db_coverage=false
          ninja -C builddir gridlock
          bash scripts/build_appimage.sh --appdir-only
          QT_QPA_PLATFORM=offscreen OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 meson test -C builddir --print-errorlogs

      - name: Build GridLock-0.7.0-x86_64.AppImage
        run: |
          ninja -C builddir gridlock
          bash scripts/build_appimage.sh
          QT_QPA_PLATFORM=offscreen ./GridLock-0.7.0-x86_64.AppImage --appimage-extract-and-run --version
          ls -lah GridLock-0.7.0-x86_64.AppImage GridLock-x86_64.AppImage

      - name: Upload AppImage Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridLock-0.7.0-x86_64.AppImage
          path: |
            GridLock-0.7.0-x86_64.AppImage
            GridLock-x86_64.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            GridLock-0.7.0-x86_64.AppImage
            GridLock-x86_64.AppImage
          generate_release_notes: true
          draft: false
