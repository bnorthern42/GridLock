name: Build and Release Artifacts

on:
  release:
    types: [published]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie

    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            build-essential \
            git \
            python3-pip \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            wget \
            ca-certificates \
            file \
            patchelf \
            libfuse2 \
            fuse \
            imagemagick \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            libqt6svg6 \
            libqt6svg6-dev \
            libqtermwidget-dev \
            openmpi-bin \
            libopenmpi-dev \
            lldb \
            llvm \
            xvfb
          update-ca-certificates
          ldconfig

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compile Qt-Advanced-Stylesheets
        run: |
          cd external/Qt-Advanced-Stylesheets
          cmake -B build -S . \
            -DQT_VERSION_MAJOR=6 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          cmake --install build
          ldconfig

      - name: Configure and Test
        run: |
          meson setup builddir --prefix=/usr --buildtype=release
          xvfb-run -a meson test -C builddir

      - name: Build AppImage
        run: |
          bash scripts/build_appimage.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: GridLock-*.AppImage
          generate_release_notes: true
          draft: false
  flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest


    steps:
      - name: Install flatpak builder dependencies
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder xvfb

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: GridLock.flatpak
          manifest-path: org.gridlock.GridLock.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: GridLock.flatpak

  toolpak:
    name: Build Toolpak
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie
      options: --privileged # Required for loopback mount

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            build-essential \
            git \
            python3-pip \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            sudo \
            e2fsprogs \
            fdisk \
            util-linux \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            libqt6svg6-dev \
            libqtermwidget-dev \
            openmpi-bin \
            libopenmpi-dev \
            lldb \
            llvm \
            xvfb

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile Qt-Advanced-Stylesheets
        run: |
          cd external/Qt-Advanced-Stylesheets
          cmake -B build -S . \
            -DQT_VERSION_MAJOR=6 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          cmake --install build
          ldconfig

      - name: Configure App
        run: |
          meson setup builddir --prefix=/usr --buildtype=release

      - name: Build Toolpak
        run: |
          bash scripts/build_toolpak.sh

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: GridLock.toolpak
