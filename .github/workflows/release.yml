name: Build, Test, and Release AppImage (v0.7.0)

on:
  release:
    types: [published]
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Package GridLock v0.7.0 AppImage
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie

    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
      QT_QPA_PLATFORM: "offscreen"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

    steps:
      - name: Install v0.7.0 system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            g++ \
            clang \
            clangd \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            git \
            patchelf \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            libqt6sql6-sqlite \
            libqt6svg6 \
            libqt6svg6-dev \
            libqtermwidget6-dev \
            libsqlite3-dev \
            openmpi-bin \
            libopenmpi-dev \
            gdb \
            lldb \
            llvm \
            binutils \
            elfutils \
            file \
            xvfb \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxcb-shape0 \
            fuse \
            libfuse2 \
            wget \
            ca-certificates \
            imagemagick \
            desktop-file-utils \
            appstream
          update-ca-certificates
          ldconfig

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compile Qt-Advanced-Stylesheets
        run: |
          cd external/Qt-Advanced-Stylesheets
          cmake -B build -S . \
            -DQT_VERSION_MAJOR=6 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          cmake --install build
          ldconfig

      - name: Configure and Run Full 26-Suite Test Harness (Headless)
        run: |
          meson setup builddir --prefix=/usr --buildtype=release
          ninja -C builddir
          QT_QPA_PLATFORM=offscreen OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 meson test -C builddir --print-errorlogs

      - name: Build GridLock-0.7.0-x86_64.AppImage
        run: |
          bash scripts/build_appimage.sh
          ls -lah GridLock-0.7.0-x86_64.AppImage GridLock-x86_64.AppImage

      - name: Upload AppImage Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridLock-0.7.0-x86_64.AppImage
          path: |
            GridLock-0.7.0-x86_64.AppImage
            GridLock-x86_64.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            GridLock-0.7.0-x86_64.AppImage
            GridLock-x86_64.AppImage
          generate_release_notes: true
          draft: false
