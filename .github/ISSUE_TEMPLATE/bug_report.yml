name: Bug Report
description: Report a crash, debugger backend fault, or UI regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide enough detail for maintainers to reproduce the issue.

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected Area
      description: Which subsystem is primarily affected?
      options:
        - "Multi-Rank GDB/MI3 Coordinator"
        - "DAP Backend"
        - "Source Editor & clangd LSP"
        - "Disassembly / CFG / Decompiler"
        - "Variables, Watch & Pointer Graph"
        - "Memory View & Library Memory Map"
        - "MPI Diagnostics & Deadlock Analyzer"
        - "Build / AppImage / Packaging"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: What is the impact of this bug?
      options:
        - "Critical - Crash, data loss, or completely blocked workflow"
        - "High - Major feature broken without a clean workaround"
        - "Medium - Incorrect behavior or UI glitch with workaround"
        - "Low - Minor cosmetic or edge-case issue"
    validations:
      required: true

  - type: input
    id: gridlock_version
    attributes:
      label: GridLock Version
      description: Output of `./gridlock --version` or release tag
      placeholder: "v0.9.1"
    validations:
      required: true

  - type: input
    id: os_display
    attributes:
      label: OS, Cluster Environment & Display Server
      description: Linux distro / HPC cluster (e.g., Slurm login/compute node, GPU node) and Wayland/X11/offscreen setup
      placeholder: "Rocky Linux 9 / Slurm + H200 or Fedora / Wayland"
    validations:
      required: true

  - type: input
    id: toolchain_versions
    attributes:
      label: Compiler, MPI & Debugger Versions (`gdb --version`)
      description: Exact versions of compiler (GCC/Clang/gfortran/ifx), MPI implementation & launcher flags (OpenMPI/MPICH/Intel MPI/Cray PMI), and `gdb --version` / `rocgdb --version` / `lldb-dap --version`
      placeholder: "GCC 14 / gfortran 14, OpenMPI 5.0 (mpirun --oversubscribe), GNU gdb 15.2"
    validations:
      required: false

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact numbered steps to trigger the issue (include MPI rank count and launcher command line if relevant).
      placeholder: |
        1. Launch GridLock with ...
        2. Set breakpoint on ...
        3. Run with -np 4 ...
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: Describe what you expected to happen and what happened instead.
    validations:
      required: true

  - type: textarea
    id: sanitized_mi_trace
    attributes:
      label: Sanitized GDB/MI Trace (Required for Debugger, Parser, MPI, or Cluster Bugs)
      description: Export a redacted transcript via **Tools -> Export Sanitized GDB/MI Trace...** (or `./gridlock --export-mi-trace trace.mi.log`) and paste or attach it here so maintainers can replay the exact MI sequence in a unit test.
      placeholder: |
        # GridLock Sanitized GDB/MI Session Trace
        # Paste or drag-and-drop your .mi.log file here...
    validations:
      required: false

  - type: textarea
    id: logs_and_screenshots
    attributes:
      label: Additional Logs, Backtrace, or Screenshots
      description: Paste terminal output, `process_vm_readv` / Slurm errors, or attach `.png` screenshots (`.png` screenshots are welcome for UI issues).
    validations:
      required: false
