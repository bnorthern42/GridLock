# ==============================================================================
# GridLock — SonarQube / SonarCloud Static Analysis & Coverage Configuration
# ==============================================================================
sonar.projectKey=gridlock
sonar.projectName=GridLock
sonar.projectVersion=0.8.0
sonar.projectDescription=C++23 and Qt6 Multi-Rank MPI Debugger and ELF Binary Inspector

# Source & Test Directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C++23 Language Standard & Compilation Database
sonar.cxx.std=c++23
sonar.cfamily.compile-commands=builddir/compile_commands.json
sonar.cxx.compileCommands=builddir/compile_commands.json
sonar.cxx.jsonCompilationDatabase=builddir/compile_commands.json
sonar.cxx.file.suffixes=.cxx,.cpp,.cc,.c,.hxx,.hpp,.hh,.h

# Coverage Reports (gcov / gcovr Cobertura XML)
sonar.cfamily.gcov.reportsPath=builddir
sonar.cxx.cobertura.reportPaths=builddir/meson-logs/coverage.xml

# Exclusions (Generated Qt MOC/RCC files and bundled third-party libraries)
sonar.exclusions=external/**,builddir/**,src/third_party/**,**/*_moc.cpp,**/moc_*.cpp,**/qrc_*.cpp
